vault::user: 'vault'
vault::manage_user: true
vault::group: 'vault'
vault::manage_group: true
vault::config_dir: '/etc/vault'
vault::purge_config_dir: false
vault::service_name: 'vault'
vault::service_enable: true
vault::package_ensure: 'present'
vault::repo_baseurl: 'https://rpm.releases.hashicorp.com/RHEL/$releasever/$basearch/stable'
vault::repo_gpgkey: 'https://rpm.releases.hashicorp.com/gpg'
vault::listen_address: '0.0.0.0'
vault::listen_port: 8200
vault::ui_enabled: true
vault::tls_disable: true
