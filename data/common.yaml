security::disabled_services:
  - telnet
  - ftp

ntp::package_name: 'ntp'
ntp::service_name: 'ntpd'
ntp::enable: true
ntp::servers:
  - '0.centos.pool.ntp.org'
  - '1.centos.pool.ntp.org'

timezone::zone: 'Asia/Kolkata'

#### puppet agent 5 value #####
puppet_agent5::server: 'puppetmaster.puppetlab.com'
puppet_agent5::masterport: 8142
puppet_agent5::ca_server: 'puppetca.puppetlab.com'
puppet_agent5::ca_port: 8141
puppet_agent5::certificate_revocation: false
puppet_agent5::agent_version: '5.5.22'
puppet_agent5::repo_baseurl: 'https://yum.puppet.com/puppet5/el/7/$basearch'
puppet_agent5::repo_gpgkey: 'https://yum.puppet.com/RPM-GPG-KEY-puppet-20250406'
puppet_agent5::base_packages:
  - 'bind-utils'
  - 'socat'
  - 'policycoreutils-python'
  - 'rsync'
  - 'epel-release'
resolve_conf::search_domain: 'puppetlab.com'
resolve_conf::nameservers:
  - '10.0.1.10'
  - '10.0.1.40'
