version: 5
defaults:
  datadir: data
  data_hash: yaml_data
hierarchy:
  - name: "Per-node data"
    path: "nodes/%{trusted.certname}.yaml"
  - name: "Per-hostgroup data (from Foreman's own auto-injected fact)"
    path: "hostgroups/%{hostgroup}.yaml"
  - name: "Common data"
    path: "common.yaml"
